
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Landing Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
    --blue: #2563eb;
    --bg: #f1f5f9;
    --space: 20px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: #1e293b;
}

/* 7.1 Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space);
    background: white;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    color: var(--blue);
    font-size: 24px;
    font-weight: 600;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 20px;
}

a {
    text-decoration: none;
    color: #1e293b;
}

button {
    background: var(--blue);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
}

/* 7.2 Banner */
.banner {
    min-height: 300px;
    background: var(--blue);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: var(--space);
    gap: 15px;
}

/* 7.3 Cards */
.cards {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space);
    padding: var(--space);
}

.card {
    flex: 1 1 200px;
    background: white;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
}

/* Responsive Design */
@media (max-width: 600px) {
    .navbar {
        flex-direction: column;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
    }

    .banner h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">MyWebsite</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <button>Contact</button>
    </div>
</nav>

<!-- Banner -->
<section class="banner">
    <h1>Welcome to My Website</h1>
    <p>Learn, Create and Build Your Future</p>
    <button>Get Started</button>
</section>

<!-- Cards -->
<section class="cards">
    <div class="card">
        <h2>HTML</h2>
        <p>Build the structure of websites.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Design beautiful web pages.</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Add interactive features.</p>
    </div>
</section>

</body>
</html>
